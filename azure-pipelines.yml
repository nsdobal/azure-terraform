trigger:
- main

pool:
  vmImage: ubuntu-latest

variables:
  workingDir: 'Modules-Resources/Resource-Group'

stages:

# ================= VALIDATE =================
- stage: Validate

  jobs:
  - job: validate

    steps:

    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    # Terraform Format
    - script: |
        terraform fmt
      workingDirectory: '$(workingDir)'
      displayName: "Terraform Format"

    # Terraform Init + Validate
    - task: AzureCLI@2
      displayName: "Terraform Init & Validate"

      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        workingDirectory: '$(workingDir)'

        inlineScript: |

          echo "Azure Login Successful"

          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          terraform init
          terraform validate


# ================= PLAN =================
- stage: Plan

  dependsOn: Validate

  jobs:
  - job: plan

    steps:

    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    # Terraform Plan
    - task: AzureCLI@2
      displayName: "Terraform Plan"

      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: 'bash'
        scriptLocation: 'inlineScript'
        addSpnToEnvironment: true
        workingDirectory: '$(workingDir)'

        inlineScript: |

          echo "Azure Login Successful"

          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)

          terraform init
          terraform plan


# ---------------- APPLY ----------------
- stage: Apply
  dependsOn: Plan
  condition: succeeded()

  jobs:
  - job: apply

    steps:
    - checkout: self

    # Install Terraform
    - task: TerraformInstaller@1
      inputs:
        terraformVersion: 'latest'

    # Azure Authentication + Terraform Apply
    - task: AzureCLI@2
      inputs:
        azureSubscription: 'azure-sc-dev'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |

          echo "Azure Login Successful"

          export ARM_CLIENT_ID=$servicePrincipalId
          export ARM_TENANT_ID=$tenantId
          export ARM_SUBSCRIPTION_ID=$(az account show --query id -o tsv)
          
          terraform init
          terraform apply -auto-approve
        workingDirectory: '$(workingDir)'
      displayName: "Terraform Apply"